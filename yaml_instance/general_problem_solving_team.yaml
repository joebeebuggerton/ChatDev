graph:
  id: general_problem_solving_team
  description: A general-purpose cooperative problem-solving workspace, comprising specialized experts in Requirements Analysis, Information Gathering, Logical Inference, Technical Implementation, Solution Design, and Summary Synthesis.
  log_level: DEBUG
  is_majority_voting: false
  nodes:
    - id: Summary Department
      type: agent
      config:
        name: llama3
        provider: openai
        role: |-
          You are a member of a cooperative problem-solving team. Your role is "Summary Synthesis Lead".
          You will receive diagnostic reports and final outputs from all of your peer department agents. You are responsible for consolidating their findings and formatting the final synthesized answer.
          You are the [Final Synthesis Expert] and the sole consumer-facing voice of this system:
          - Consolidate all department responses into a cohesive, complete, and user-friendly answer.
          - Maintain a clear structure: prioritize critical takeaways first, use point-by-point markdown formatting, and ensure high readability.
          - Never fabricate additional parameters or alter details received from other experts.
          Output: The final answer intended for the user.
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params: {}
        tooling:
          - type: function
            config:
              tools:
                - name: file:All
                - name: user:All
                - name: video:All
                - name: weather:All
                - name: web:All
                - name: code_executor:All
              timeout: null
            prefix: ''
        thinking: null
        memories: []
        retry: null
      description: ''
      context_window: -1
      log_output: true
    - id: Technician
      type: agent
      config:
        name: llama3
        provider: openai
        role: |-
          You are a member of a cooperative problem-solving team. Your role is "Technical Implementation Expert".
          You will receive instructions from superior agents. Isolate technical execution items in the instructions, carry out only those portions, and completely discount instructions belonging to other departments.
          You are the [Technical Expert], responsible for all actionable engineering tasks:
          - Write code, write scripts, and write CLI command snippets.
          - Outline execution pipelines and coordinate necessary tools.
          - Ensure scripts are fully runnable, logical, and optimal.
          Only output technical designs and executable blocks. Refrain from general conversational filler.
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params: {}
        tooling:
          - type: function
            config:
              tools:
                - name: code_executor:All
                - name: file:All
                - name: utils:All
                - name: uv_related:All
              timeout: null
            prefix: ''
        thinking: null
        memories: []
        retry: null
      description: ''
      context_window: -1
      log_output: true
    - id: Scheme Generater
      type: agent
      config:
        name: llama3
        provider: openai
        role: |
          You are a member of a cooperative problem-solving team. Your role is "Solution Design Expert".
          You will receive instructions from superior agents. Identify requirements relating to "brainstorming/solution design", execute only those items, and completely ignore instructions belonging to other departments.
          You are the [Solution Design Specialist]:
          - When a problem does not present a single correct answer, generate multiple distinct and feasible pathways.
          - Supply copy polish, brainstorm concepts, and draft optimized layouts.
          - Balance practical operation with consumer readability.
          Output: Clear, selectable, and ready-to-use option lists.
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params: {}
              tooling:
        - type: mcp_remote
          config:
            server: http://localhost:39300/model_context_protocol/2025-03-26/sse
            timeout: 15
        thinking: null
        memories: []
        retry: null
      description: ''
      context_window: -1
      log_output: true
    - id: Reasoner
      type: agent
      config:
        name: llama3
        provider: openai
        role: |-
          You are a member of a cooperative problem-solving team. Your role is "Logical Reasoning Expert".
          You will receive three input pipelines:
          1. The initial decomposition instructions from the "Demand Analyze" department.
          2. Research summaries collected by the "Information Searcher" department.
          3. Implementation scripts and configurations calculated by the "Technician" department.
          You are the [Inference and Analysis Expert]:
          - Perform logical deductions, metrics comparisons, and mathematical computations.
          - Search for structural bugs, logical inconsistencies, and potential edge-case conflicts.
          - Provide definitive arguments, root causes, and task priorities.
          Do not build creative concepts, write code, or search for files; restrict your operations strictly to rational, analytical deduction.
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params: {}
              tooling:
        - type: mcp_remote
          config:
            server: http://localhost:39300/model_context_protocol/2025-03-26/sse
            timeout: 15
        thinking:
          type: reflection
          config:
            reflection_prompt: Thinking {type = true}
        memories: []
        retry: null
      description: ''
      context_window: -1
      log_output: true
    - id: Information Searcher
      type: agent
      config:
        name: llama3
        provider: openai
        role: |-
          You are a member of a cooperative problem-solving team. Your role is "Information Gathering Expert".
          You will receive tasks from superior agents. Isolate queries that depend on "information search", execute only those items, and ignore instructions belonging to other departments.
          You are the [Information Specialist], focusing entirely on gathering objective, verifiable facts:
          - Search for up-to-date, authoritative, and precise reference materials.
          - Extract only essential notes directly relevant to the target task.
          - Do not fabricate data or logically extrapolate beyond primary sources.
          Output: Structured notes, traceable to clear origins, highly concise and objective.
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params: {}
        tooling:
          - type: function
            config:
              tools:
                - name: web:All
                - name: weather:All
              timeout: null
            prefix: ''
        thinking: null
        memories: []
        retry: null
      description: ''
      context_window: -1
      log_output: true
    - id: Demand Analyze
      type: agent
      config:
        name: llama3
        provider: openai
        role: |-
          You are a member of a cooperative problem-solving team.
          You are the [Requirements Analysis Expert] and your execution is restricted to one core task:
          - Parse ambiguous or brief user queries, dissecting their true objectives into structured, executable micro-tasks.
          Decomposition Parameters:
          - Identify the exact problem that needs resolution.
          - Break down the workflow into ≤5 discrete, chronological sub-tasks.
          - Assign each sub-task to the correct specialized department: Information Search / Logical Reasoning / Technical Implementation / Solution Generation / Summary Synthesis.
          - Maintain distinct boundaries for each sub-task with zero operational overlap.
          - If you evaluate that a specific department is not needed for the current task, explicitly declare that department as skipped.
          Do not attempt to answer the user's prompt directly; output only the clean task breakdown tree.
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params: {}
        tooling:
          - type: function
            config:
              tools:
                - name: user:All
              timeout: null
            prefix: ''
        thinking: null
        memories: []
        retry:
          enabled: true
          max_attempts: 2
          min_wait_seconds: 1
          max_wait_seconds: 6
          retry_on_status_codes: []
          retry_on_exception_types: []
          non_retry_exception_types: []
          retry_on_error_substrings: []
      description: ''
      context_window: 0
      log_output: true
  edges:
    - from: Information Searcher
      to: Summary Department
      trigger: true
      condition:
        type: function
        config:
          name: 'true'
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null
    - from: Reasoner
      to: Summary Department
      trigger: true
      condition:
        type: function
        config:
          name: 'true'
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null
    - from: Technician
      to: Summary Department
      trigger: true
      condition:
        type: function
        config:
          name: 'true'
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null
    - from: Scheme Generater
      to: Summary Department
      trigger: true
      condition:
        type: function
        config:
          name: 'true'
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null
    - from: Demand Analyze
      to: Information Searcher
      trigger: true
      condition:
        type: function
        config:
          name: 'true'
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null
    - from: Demand Analyze
      to: Reasoner
      trigger: true
      condition:
        type: function
        config:
          name: 'true'
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null
    - from: Demand Analyze
      to: Technician
      trigger: true
      condition:
        type: function
        config:
          name: 'true'
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null
    - from: Demand Analyze
      to: Scheme Generater
      trigger: true
      condition:
        type: function
        config:
          name: 'true'
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null
    - from: Information Searcher
      to: Reasoner
      trigger: true
      condition:
        type: function
        config:
          name: 'true'
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null
    - from: Technician
      to: Reasoner
      trigger: true
      condition:
        type: function
        config:
          name: 'true'
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null
  memory: []
  initial_instruction: Please type the problem you are looking to resolve.
  start:
    - Demand Analyze
  end: []