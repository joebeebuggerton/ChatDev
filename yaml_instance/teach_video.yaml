graph:
  id: Video_Creator
  description: 'Teaching video pipeline using Manim: outline, paginate, render, and concat.'
  log_level: DEBUG
  is_majority_voting: false
  nodes:
    - id: Visualization Executor
      type: python
      config:
        args: []
        env: {}
        timeout_seconds: 60
        encoding: utf-8
      description: ''
      context_window: 0
    - id: Video Concat
      type: agent
      config:
        name: llama3.1
        provider: openai
        role: Please call `describe_available_files` first to check the paths of `.mp4` video files in the current directory; the names of the different mp4 files represent their content sequence. Sort them based on their names, and call the `concat_videos` tool to concatenate them. Note that `concat_videos` expects a list constructed of sorted, absolute paths as input.
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params: {}
        tooling:
          - type: function
            config:
              tools:
                - name: concat_videos
                - name: describe_available_files
              timeout: null
            prefix: ''
        thinking: null
        memories: []
        retry: null
      description: ''
      context_window: 0
    - id: Content Composer
      type: agent
      config:
        name: llama3.1
        provider: openai
        role: |-
          You are a rigorous academic teaching assistant. Please generate a concise teaching blueprint/syllabus from the raw session data you receive.

          Requirements:
          1. Keep the language concise, precise, and objective, avoiding any marketing fluff or hyperbole.
          2. Do not include markdown tables, code blocks, or nested multi-level lists. Utilize an unordered flat bullet list containing 1 to 3 items at most to highlight core takeaways.
          3. Directly output the clean Markdown text. Do not wrap the output in intros or additional system meta-text.
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params: {}
                   tooling:
                - type: mcp_local
          config:
            command: npx
            args:
              - "-y"
              - "@modelcontextprotocol/server-github"
            env:
              GITHUB_PERSONAL_ACCESS_TOKEN: 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
            timeout: 30
            timeout: 15
            timeout: 15
        thinking: null
        memories: []
        retry: null
      description: ''
      context_window: 0
    - id: Code Generator
      type: agent
      config:
        name: qwen2.5-coder
        provider: openai
        role: |-
          You are a **Manim Animation Generation Agent** specializing in automated planning, source code creation, and direct engine execution.
          You will receive a slide layout prompt (in Markdown format) representing the core topic, along with context concerning its position in the overall course map.
          **The position context is provided solely for conceptual understanding and must not be rendered on the slide itself**; you are strictly responsible for constructing a single animated frame matching the primary target slide prompt.

          Your workflow must run autonomously without query prompts to the user:
          1. Analyze the input, plan a single visual Manim slide workflow, and ensure content is neat and logically complete;
          2. Output **fully-formed, error-free, copy-paste-ready Manim Python source code**;
          3. Ensure no external textual explanations exist outside your script block.

          ---

          ### Critical Design Constraints (Strictly Enforced):

          1. **Output must be pure Python code exclusively**, without markdown block wraps (no ```python frames in output) or trailing remarks;
          2. Do not generate specialized start/credits slides. Every slide **must show its main Title at the top**;
          3. Title text must be a **high-level, concise summary** of the exact concept. **Using slide numbers like 'Page X' is strictly forbidden**;
          4. Title positioning, layout, fonts, and animation wrappers **must strictly align with this template** (substituting placeholder title text only):

          ```
          title = Text("Your Concept Here",
                       font_size=34,
                       font="AR PL UKai CN",
                       color=WHITE,
                       weight=BOLD)
          title.to_edge(UP, buff=0.5)

          title_line = Line(LEFT, RIGHT, color=ORANGE).next_to(title, DOWN, buff=0.1)
          title_line.match_width(title)

          title_group = VGroup(title, title_line)

          self.play(
              Write(title, run_time=1.5),
              GrowFromCenter(title_line, run_time=0.8)
          )
          ```

          5. All localized strings and definitions must be rendered in English (except where standard system labels require raw values);
          6. Max animate sequence must fit cleanly in **≤15 seconds**;
          7. Fonts must maintain a minimum scaling bounds rendering clean and legible on video surfaces;
          8. Elements must display linearly using explicit sequence plays: `self.play(Write(...))`, `self.play(FadeIn(...))`, etc.;
          9. Draw shapes, maps, coordinates, charts, or connected graphs to make logical trends visual;
          10. Avoid overly busy animations, element collisions, and bounding leaks;
          11. **Always use `SurroundingRectangle`**; using standard `Rectangle` and `RoundedRectangle` is forbidden;
          12. **Forbid standard external images**, no `ImageMobject()`;
          13. Math formulations must use `MathTex()`;
          14. Process steps can utilize `BulletedList` structures or sequentially written text blocks;
          15. **Strictly avoid typographic quote variations (keep standard programmatic straight quotes)**;
          16. Do not append execution warnings, logs, or system indicators.

          ---

          ### Debugging & Syntax Common Failures (Avoid all of these):

          - **Issue Type 1: IndexError: list index out of range**
            This happens in Manim when using `.get_rows()[x][y]` or accessing indices of a `BulletedList` that exceed length bounds.
          - **Issue Type 2: Text() and MathTex() do not support alignment**
            Do not pass arguments like `alignment="CENTER"` inside `Text` objects.
          - **Issue Type 3: LaTeX Formatting Errors**
            The `&` character is a reserved operator in LaTeX layout structures and must be escaped (`\&`). Also note that `TextBulletedList` is not supported. Use standard `BulletedList("A", "B")`.
          - **Issue Type 4: BulletedList Constraints**
            Do not access sub-components of a `BulletedList` using standard array indexing (e.g., list[0][1]) or nested child arrays.
          - **Issue Type 5: Manim Version Compliance**
            Compile pipeline matches Manim Community v0.19.0. Standard commands from older environments (like `ShowCreation`) are deprecated; substitute with `Create()`.
          - **Issue Type 6: Object Layout Overlap**
            Always set explicit relational alignment on text groups using `next_to(...)` or arrange them cleanly inside a vertical/horizontal `VGroup().arrange(DOWN, buff=0.5)` stack so elements do not render on top of each other.
          - **Issue Type 7: Formula Scaling**
            Wrap long equations in step-by-step components so bounds are not cropped.
          - **Issue Type 8: Code() Parameters**
            The standard `Code()` helper block does not support `font_size` or `code` kwargs, and does not expose a `.code` attribute. Ensure any multi-line triple-quoted code snippet keeps proper literal indentation.
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params: {}
                   tooling:
                - type: mcp_local
          config:
            command: npx
            args:
              - "-y"
              - "@modelcontextprotocol/server-github"
            env:
              GITHUB_PERSONAL_ACCESS_TOKEN: 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
            timeout: 30
            timeout: 15
            timeout: 15
        thinking: null
        memories: []
        retry: null
      description: ''
      context_window: 0
    - id: Concluder
      type: agent
      config:
        name: llama3.1
        provider: openai
        role: |-
          Please call `describe_available_files` first to check the paths of `.py` script files in the current workspace. Then use the `render_manim` tool to render them. This tool expects only the `script_path` (absolute path of your Python script) as an argument. If multiple Python scripts are found, you must run `render_manim` on each separate script sequentially.
          If any compilation trace or execution fault is returned during `render_manim`, output the detailed error stack trace along with the word "ERROR".
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params: {}
        tooling:
          - type: function
            config:
              tools:
                - name: render_manim
                - name: describe_available_files
              timeout: null
            prefix: ''
        thinking: null
        memories: []
        retry: null
      description: ''
      context_window: 0
    - id: Paginator
      type: agent
      config:
        name: llama3.1
        provider: openai
        role: |-
          You are a professional document formatting specialist, skilled at inserting appropriate pagination markers into raw educational scripts.

          Task: Take the provided Markdown workspace syllabus and insert clean pagination break tags while fully preserving all original content.

          Workspace Syllabus:
          {section_content}

          ## Execution Guidelines:
          1. **Verify Integrity of Original Content** - Retain every sentence, code snippet, punctuation, blank line, format, and section structure exactly as received.
          2. **Strictly Limit Changes to Segmentation Tags** - Only insert clear dividing points in logical breaks.
          3. **Preserve Conceptual Flow** - Do not divide a single conceptual definition across slides.
          4. **Keep Blocks Complete** - Confirm code blocks are kept intact.

          ## Segmentation Tag Formatting:
          - Use `<!-- PAGEBREAK -->` as your singular page break tag.
          - The tag must sit on its own line.

          ## Slicing Strategies:
          - Each slide block corresponds directly to a subsequent Manim execution slide. Ensure the conceptual units are detailed but not overly granular.
          - If a file is brief and does not benefit from segment boundaries, output it as is.
          - Ensure section headings do not sit orphaned at the bottom of a page.

          ## Requirements:
          - Maintain standard Markdown formatting.
          - The break placeholder must be placed on its own line.
          - **Strictly forbid structural omissions or placeholders (do not use "..." or leave sections out).**

          ## Output Format:
          Directly return the paginated Markdown document. Do not wrap the output with pleasantries or meta descriptions.
        base_url: ${BASE_URL}
        api_key: ${API_KEY}
        params: {}
                   tooling:
                - type: mcp_local
          config:
            command: npx
            args:
              - "-y"
              - "@modelcontextprotocol/server-github"
            env:
              GITHUB_PERSONAL_ACCESS_TOKEN: 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
            timeout: 30
            timeout: 15
            timeout: 15
        thinking: null
        memories: []
        retry: null
      description: ''
      context_window: 0
  edges:
    - from: Visualization Executor
      to: Code Generator
    - from: Visualization Executor
      to: Concluder
      trigger: true
      condition:
        type: function
        config:
          name: code_fail
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null
    - from: Visualization Executor
      to: Concluder
      trigger: true
      condition:
        type: function
        config:
          name: code_pass
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null
    - from: Concluder
      to: Code Generator
      trigger: true
      condition:
        type: keyword
        config:
          any:
            - ERROR
          none: []
          regex: []
          case_sensitive: true
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null
    - from: Concluder
      to: Video Concat
      trigger: true
      condition: 'true'
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null
    - from: Content Composer
      to: Paginator
      trigger: true
      condition: 'true'
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic: null
    - from: Code Generator
      to: Visualization Executor
      trigger: true
      condition: 'true'
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic:
        type: map
        split:
          type: message
          config: {}
        config:
          max_parallel: 10
    - from: Paginator
      to: Code Generator
      trigger: true
      condition: 'true'
      carry_data: true
      keep_message: false
      clear_context: false
      clear_kept_context: false
      process: null
      dynamic:
        type: map
        split:
          type: regex
          config:
            pattern: (.*?)<!--\s*PAGEBREAK\s*-->
            group: ''
            case_sensitive: true
            multiline: false
            dotall: false
            on_no_match: pass
        config:
          max_parallel: 10
  memory: []
  initial_instruction: ''
  start:
    - Content Composer
  end: []
version: 0.0.0
vars: {}